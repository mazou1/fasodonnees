server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API publique (et sa doc) servie par FastAPI
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # la page Swagger (/api/docs) référence /openapi.json à la racine
    location = /openapi.json {
        proxy_pass http://api:8000/openapi.json;
    }

    # Corpus archivé, en lecture publique et à URL STABLES.
    #
    # Ce sont des publications officielles : rien à protéger, et tout à gagner à
    # ce qu'un lien vers un rapport d'audit reste valable des années et puisse
    # être miroité. D'où le point d'accès web de Garage plutôt que des URL
    # présignées, qui expiraient au bout d'une heure.
    #
    # Garage identifie le bucket par l'en-tête Host (root_domain « .web.garage »
    # dans deploy/garage.toml) : on le réécrit ici, ce qui évite d'exposer un
    # sous-domaine et un certificat de plus. Les clés étant des empreintes de
    # contenu, un objet ne change jamais : cache long sans risque.
    location /archives/ {
        proxy_pass http://garage:3902/;
        proxy_set_header Host faso-archives.web.garage;
        proxy_hide_header x-amz-request-id;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # SPA : toute route inconnue retombe sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
