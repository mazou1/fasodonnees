# Garage — stockage objet S3-compatible pour l'archive brute (PDF/HTML collectés).
#
# Mono-nœud : suffisant pour un déploiement sur une seule machine. Garage sait
# répliquer sur plusieurs nœuds géographiquement séparés — c'est là qu'il prend
# tout son sens (cf. deploy/README.md, section stockage). Passer à 3 nœuds ne
# demande que de porter replication_factor à 3 et de connecter les pairs.
#
# `metadata_dir` et `data_dir` sont montés sur des volumes Docker : les perdre,
# c'est perdre le corpus. Ils font partie du périmètre de sauvegarde.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

# Aucun secret dans ce fichier : il est versionné. Garage les lit dans
# l'environnement (GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN, GARAGE_METRICS_TOKEN),
# alimenté par le .env — lui-même gitignoré. Générer chaque valeur avec :
#   openssl rand -hex 32
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
# Style « path » : http://endpoint/bucket/cle plutôt que http://bucket.endpoint/cle.
# C'est ce que configure app/stockage.py côté client.
root_domain = ".s3.garage"

[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage"
index = "index.html"

[admin]
api_bind_addr = "[::]:3903"
# admin_token et metrics_token : voir GARAGE_ADMIN_TOKEN / GARAGE_METRICS_TOKEN
