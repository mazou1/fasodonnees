services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: faso
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faso}
      POSTGRES_DB: faso
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faso -d faso"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Stockage objet de l'archive brute. Optionnel : activer avec
  #   docker compose --profile garage up -d
  # Sans ce profil, l'archive reste sur le disque (FASO_STOCKAGE=local), et
  # FASO_S3_ENDPOINT peut tout aussi bien pointer vers un S3 externe : la
  # couche app/stockage.py ne voit qu'un endpoint S3, d'où qu'il vienne.
  garage:
    image: dxflrs/garage:v1.0.1
    profiles: ["garage"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET manquant (openssl rand -hex 32)}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN manquant (openssl rand -hex 32)}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN:-}
    volumes:
      - ./deploy/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      - "3900:3900"  # API S3
      - "3903:3903"  # admin (création du bucket et des clés)
    restart: unless-stopped

  api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      FASO_DATABASE_URL: postgresql+psycopg://faso:${POSTGRES_PASSWORD:-faso}@db:5432/faso
      FASO_DATA_DIR: /data
      FASO_STOCKAGE: ${FASO_STOCKAGE:-local}
      FASO_S3_ENDPOINT: ${FASO_S3_ENDPOINT:-}
      FASO_S3_BUCKET: ${FASO_S3_BUCKET:-faso-archives}
      FASO_S3_ACCESS_KEY: ${FASO_S3_ACCESS_KEY:-}
      FASO_S3_SECRET_KEY: ${FASO_S3_SECRET_KEY:-}
      FASO_S3_REGION: ${FASO_S3_REGION:-garage}
      FASO_ADMIN_USER: ${FASO_ADMIN_USER:-admin}
      FASO_ADMIN_PASSWORD: ${FASO_ADMIN_PASSWORD:-change-me}
      FASO_SECRET_KEY: ${FASO_SECRET_KEY:-change-me-long-random}
    ports:
      - "8001:8000"
    volumes:
      - ./backend/data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: ./backend
    command: python -m app.ingestion.scheduler
    environment:
      FASO_DATABASE_URL: postgresql+psycopg://faso:${POSTGRES_PASSWORD:-faso}@db:5432/faso
      FASO_DATA_DIR: /data
      FASO_STOCKAGE: ${FASO_STOCKAGE:-local}
      FASO_S3_ENDPOINT: ${FASO_S3_ENDPOINT:-}
      FASO_S3_BUCKET: ${FASO_S3_BUCKET:-faso-archives}
      FASO_S3_ACCESS_KEY: ${FASO_S3_ACCESS_KEY:-}
      FASO_S3_SECRET_KEY: ${FASO_S3_SECRET_KEY:-}
      FASO_S3_REGION: ${FASO_S3_REGION:-garage}
      FASO_LLM_PROVIDER: ${FASO_LLM_PROVIDER:-mistral}
      FASO_MISTRAL_API_KEY: ${FASO_MISTRAL_API_KEY:-}
      FASO_ANTHROPIC_API_KEY: ${FASO_ANTHROPIC_API_KEY:-}
    volumes:
      - ./backend/data:/data
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8090:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  # métadonnées ET données de Garage : les perdre, c'est perdre le corpus brut
  garage_meta:
  garage_data:
