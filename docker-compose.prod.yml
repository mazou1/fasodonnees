# Déploiement production — VPS unique (Hetzner) derrière Caddy (HTTPS auto).
#
# Fichier AUTONOME : à lancer seul, pas en override du docker-compose.yml de dev
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Seul Caddy expose des ports (80/443). db, api, worker, web restent sur le
# réseau interne. Variables lues depuis le fichier .env (voir deploy/.env.prod.example).
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: faso
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_DB: faso
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faso -d faso"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Stockage objet de l'archive brute — OPTIONNEL, activé par
  #   docker compose -f docker-compose.prod.yml --profile garage up -d
  #
  # ⚠ Sur CE VPS, Garage partage le disque et le domaine de panne de
  # l'application : il n'apporte alors AUCUNE durabilité supplémentaire. Il ne
  # protège que s'il tourne sur une autre machine (ou en réplication multi-nœud)
  # — ou si l'on pointe FASO_S3_ENDPOINT vers un S3 externe et qu'on laisse ce
  # profil désactivé. Détail du choix dans deploy/README.md.
  garage:
    image: dxflrs/garage:v1.0.1
    profiles: ["garage"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET manquant (openssl rand -hex 32)}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN manquant (openssl rand -hex 32)}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN:-}
    volumes:
      - ./deploy/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    restart: unless-stopped

  api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      FASO_DATABASE_URL: postgresql+psycopg://faso:${POSTGRES_PASSWORD}@db:5432/faso
      FASO_DATA_DIR: /data
      FASO_STOCKAGE: ${FASO_STOCKAGE:-local}
      FASO_S3_ENDPOINT: ${FASO_S3_ENDPOINT:-}
      FASO_S3_BUCKET: ${FASO_S3_BUCKET:-faso-archives}
      FASO_S3_ACCESS_KEY: ${FASO_S3_ACCESS_KEY:-}
      FASO_S3_SECRET_KEY: ${FASO_S3_SECRET_KEY:-}
      FASO_S3_REGION: ${FASO_S3_REGION:-garage}
      # URL publiques et stables du corpus, proxifiées vers Garage par nginx
      FASO_S3_URL_PUBLIQUE: ${FASO_S3_URL_PUBLIQUE:-/archives}
      FASO_ADMIN_USER: ${FASO_ADMIN_USER:?}
      FASO_ADMIN_PASSWORD: ${FASO_ADMIN_PASSWORD:?}
      FASO_SECRET_KEY: ${FASO_SECRET_KEY:?}
    volumes:
      - ./backend/data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build: ./backend
    command: python -m app.ingestion.scheduler
    environment:
      FASO_DATABASE_URL: postgresql+psycopg://faso:${POSTGRES_PASSWORD}@db:5432/faso
      FASO_DATA_DIR: /data
      FASO_STOCKAGE: ${FASO_STOCKAGE:-local}
      FASO_S3_ENDPOINT: ${FASO_S3_ENDPOINT:-}
      FASO_S3_BUCKET: ${FASO_S3_BUCKET:-faso-archives}
      FASO_S3_ACCESS_KEY: ${FASO_S3_ACCESS_KEY:-}
      FASO_S3_SECRET_KEY: ${FASO_S3_SECRET_KEY:-}
      FASO_S3_REGION: ${FASO_S3_REGION:-garage}
      # URL publiques et stables du corpus, proxifiées vers Garage par nginx
      FASO_S3_URL_PUBLIQUE: ${FASO_S3_URL_PUBLIQUE:-/archives}
      FASO_LLM_PROVIDER: ${FASO_LLM_PROVIDER:-mistral}
      FASO_MISTRAL_API_KEY: ${FASO_MISTRAL_API_KEY:-}
      FASO_ANTHROPIC_API_KEY: ${FASO_ANTHROPIC_API_KEY:-}
    volumes:
      - ./backend/data:/data
    depends_on:
      api:
        condition: service_healthy
    # L'OCR (Tesseract) consomme 200-300 % de CPU. Sur une machine partagée avec
    # une autre application, un plafond explicite évite qu'une passe
    # d'océrisation ne fasse attendre le voisin. Vide = aucune limite.
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPUS:-0}"
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    # Se lie à UNE adresse précise, pas à 0.0.0.0. Sur un serveur dédié, la
    # valeur par défaut équivaut à l'ancien comportement. En cohabitation avec
    # une autre pile, chacune tient sa propre IP (ici une Floating IP Hetzner) :
    # sans cette restriction, le premier Caddy démarré occupe le port 80 sur
    # TOUTES les adresses et le second échoue en « port is already allocated ».
    ports:
      - "${IP_PUBLIQUE:-0.0.0.0}:80:80"
      - "${IP_PUBLIQUE:-0.0.0.0}:443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN manquant (ex. faso.example.org)}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  # à sauvegarder au même titre que la base : c'est le corpus brut
  garage_meta:
  garage_data:
