[project]
name = "fasodonnees"
version = "0.1.0"
description = "Plateforme civique Burkina Faso — agrégation d'informations publiques officielles"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # <2.1 : la ligne testée (2.0.x) ; [asyncio] = greenlet, que SQLAlchemy 2.1
    # n'installe plus d'office alors que
    # sqladmin importe sqlalchemy.ext.asyncio - sans lui, l'API ne démarre pas
    # (constaté à la reconstruction du 2026-10-20)
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqladmin>=0.18",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    # <1.0 : selectolax 1.0 retire le moteur Modest (import HTMLParser) ; le
    # passage à lexbor changerait le texte extrait, donc les empreintes
    "selectolax>=0.3,<1.0",
    "feedparser>=6.0",
    "pdfplumber>=0.11",
    # lecteur de secours : pdfminer (sous pdfplumber) rend 0 page sur les PDF
    # à xref non standard du Conseil constitutionnel — pypdf les lit
    "pypdf>=5.0",
    "pytesseract>=0.3",
    # client S3 : Garage (conteneur du compose) ou tout S3 externe
    "boto3>=1.35",
    "apscheduler>=3.10,<4",
    # majeures bornées : versions testées en local, les 3.x/1.x n'ont pas été essayées
    "mistralai>=2.6,<3",
    "anthropic>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
